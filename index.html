<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nish Mandal">
    <meta name="description" content="This is an amazing web page">
    <title>My Profile</title>
    <link href="profileStyle.css" rel="stylesheet">
</head>

<body>
    <header class="strip-nav">
        <nav>
            <ul>
                <li><a href="index.html">Profile</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <figure class="polaroid">
                <img src="images/profile-pic.jpeg" alt="Profile Picture" width="200" height="200">
            </figure>
            <div class="hero-text">
                <h1 class="poster">Nish Mandal</h1>
                <p class="sticky-note">my profile</p>
            </div>
        </section>

        <section class="patch-grid">
            <div class="patch">
                <h2>My Skills</h2>
                <p>An <em>awesome</em> and <strong>amazing</strong> website demo</p>
            </div>
            <div class="patch patch--tilt-r">
                <h2>My Hobbies</h2>
                <ul class="setlist">
                    <li>Piano</li>
                    <li>Running</li>
                    <li>Programming</li>
                </ul>
            </div>
        </section>

        <section class="patch patch--wide">
            <h2>Goals</h2>
            <ol class="setlist">
                <li>I don't know</li>
                <li>Finish this course</li>
                <li>Fly to the moon</li>
            </ol>
        </section>

        <section class="patch patch--wide news-search">
            <h2>Search for News</h2>
            <form action="https://news.google.com/search" method="get" target="_blank" rel="noopener">
                <label for="q" class="visually-hidden">Search news</label>
                <input type="text" id="q" name="q" placeholder="type a topic…" required>
                <button type="submit">Search</button>
            </form>
        </section>
    </main>

    <footer class="strip-nav">
        <p>&copy; 2026 Nish Mandal</p>
    </footer>
</body>

</html>
